plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://cursemaven.com"
			}
		}
		filter {
			includeGroup "curse.maven"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				url = "https://maven.ftb.dev/releases"
			}
		}
		filter {
			includeGroup"dev.latvian.mods"
			includeGroup"dev.ftb.mods"
		}
	}
	maven {url = 'https://maven.parchmentmc.org' }
	maven {url = 'https://maven.wispforest.io' }
	maven {url = "https://maven.puffish.net" }
	maven {url = "https://maven.shedaniel.me/" }
	maven {url = "https://maven.azuredoom.com/mods"}
	maven {url = "https://maven.terraformersmc.com" }
	maven {url = "https://jitpack.io/" }
	maven {url = 'https://maven.ladysnake.org/releases'}
	maven {url = 'https://maven.kosmx.dev/' }

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation(annotationProcessor(include("com.github.bawnorton.mixinsquared:mixinsquared-fabric:${project.mixin_squared_version}")))
	implementation(annotationProcessor(include("io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}")))


	// Conjuring
	modImplementation "curse.maven:conjuring-422310:4920656"
	modImplementation "io.wispforest:lavender:${project.lavender_version}"
	modImplementation "io.wispforest:owo-lib:${project.owo_lib}"

	// Nameplate
	modImplementation("maven.modrinth:nameplate:${project.nameplate_version}")

	// Simply Skills
	modImplementation("maven.modrinth:simply-skills:${project.simply_skills_version}")
	modImplementation("net.puffish:skillsmod:${project.puffish_skills_version}:fabric")
	modImplementation("net.puffish:attributesmod:${project.puffish_attributes_version}:fabric")

	// RPG Series - Libraries
	modImplementation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api}-fabric")
	modImplementation("maven.modrinth:spell-power:${project.spell_power_version}-fabric")
	modImplementation("maven.modrinth:spell-engine:${project.spell_engine_version}-fabric")
	modImplementation("maven.modrinth:runes:${project.runes_version}-fabric")
	modImplementation("maven.modrinth:better-combat:${project.bettercombat_version}-fabric")
	implementation("com.github.ZsoltMolnarrr:TinyConfig:${project.tiny_config_version}")
	modImplementation("mod.azure.azurelibarmor:azurelibarmor-fabric-${project.minecraft_version}:${project.azurelib_armor_version}")
	modImplementation("mod.azure.azurelib:azurelib-fabric-${project.minecraft_version}:${project.azure_lib_version}")
	modImplementation("dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}")
	modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")
	modImplementation("dev.emi:trinkets:${project.trinkets_version}")

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishMods {
	file = remapJar.archiveFile
	changelog = new File("$project.rootDir/CHANGELOG.md").getText('UTF-8')
	type = STABLE
	modLoaders.add("fabric")

	curseforge {
		projectId = "1055023"
		projectSlug = "medieval-core-mod"
		accessToken = providers.environmentVariable("CF_TOKEN")
		minecraftVersions.add("1.20.1")
		requires("fabric-api")
	}
	modrinth {
		projectId = "xtbCwT29"
		accessToken = providers.environmentVariable("MODRINTH_TOKEN")
		minecraftVersions.add("1.20.1")
	}
}